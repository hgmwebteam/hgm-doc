# Runs when SOP masters change on main (that is, after a pull request is
# merged). Rebuilds every SOP and uploads the outputs to the portal's
# Supabase Storage bucket, so hgmportal.com shows the new version.
#
# Switched OFF until the one-time setup is done. To switch it on:
#   GitHub repo → Settings → Secrets and variables → Actions
#     Secrets:   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#     Variables: SOP_PUBLISH_ENABLED = true
name: SOP publish

on:
  push:
    branches: [main]
    paths:
      - "reference/sop/masters/**"
      - "reference/sop/renderer/**"
      - "sops/publish.config.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sop-publish
  cancel-in-progress: false

jobs:
  publish:
    if: vars.SOP_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the renderer's dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
          pip install -q weasyprint pillow

      - name: Build every SOP
        run: python3 sops/tools/build.py

      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 sops/tools/publish.py

      - name: Keep the outputs from this publish
        uses: actions/upload-artifact@v4
        with:
          name: sop-published-${{ github.sha }}
          path: sops/dist/
          retention-days: 90
