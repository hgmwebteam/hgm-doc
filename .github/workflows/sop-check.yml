# Runs on every pull request that touches an SOP master, figure or the renderer.
# Builds the changed SOPs (every SOP when the renderer or a figure changed),
# runs the automated quality gate, and publishes the result INTO THE PULL
# REQUEST: each version's page and PDF in public/sops/, its Markdown in
# sops/markdown/, and src/data/sops.json, committed back to the
# branch. Merging the pull request is publishing: Netlify deploys main.
#
# No secrets: every SOP is a public file on the site (since 2026-10-15).
# A commit pushed with GITHUB_TOKEN starts no further workflow runs, so this
# cannot loop, but it also means the bot's commit carries no check of its own.
name: SOP check

on:
  pull_request:
    paths:
      - "sops/masters/**"
      - "sops/figures/**"
      - "sops/renderer/**"
      - "sops/tools/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sop-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # build.py --changed compares against origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the renderer's dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
          pip install -q weasyprint pillow fonttools brotli

      - name: Build changed SOPs, run the gate, publish into the branch
        id: build
        run: python3 sops/tools/build.py --changed --publish
        continue-on-error: true

      - name: Commit the published files to this pull request
        if: steps.build.outcome == 'success'
        run: |
          git add public/sops sops/markdown src/data/sops.json
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "SOP build: publish the rendered pages, PDFs and SOP list"
          git push

      - name: Attach the rendered files
        uses: actions/upload-artifact@v4
        with:
          name: sop-outputs
          path: sops/dist/
          if-no-files-found: ignore

      - name: Post the report on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "" >> sops/dist/REPORT.md
          echo "Rendered files: **Actions → this run → Artifacts → sop-outputs**. When the gate passed, they are also committed to this branch." >> sops/dist/REPORT.md
          gh pr comment "$PR" --body-file sops/dist/REPORT.md --edit-last \
            || gh pr comment "$PR" --body-file sops/dist/REPORT.md

      - name: Fail the check if the gate failed
        if: steps.build.outcome == 'failure'
        run: exit 1
